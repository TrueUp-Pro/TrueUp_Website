<div id="beta-form-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="beta-form-title" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-box">
    <button type="button" class="modal-close" data-close-modal aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
    <h2 id="beta-form-title" class="modal-title">Join the TrueUp Beta Program</h2>
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSdrh6-ophzTQU8mzHgfHg5IGZj4nPsH5tays0XYp9nb8vUPtA/viewform?embedded=true"
      width="100%"
      height="600"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="Join the TrueUp Beta Program"
    >Loading…</iframe>
  </div>
</div>

<script>
(function() {
  var modal = document.getElementById('beta-form-modal');
  if (!modal) return;
  var triggers = document.querySelectorAll('.js-beta-form-open');
  var closeButtons = document.querySelectorAll('[data-close-modal]');

  function openModal() {
    modal.setAttribute('aria-hidden', 'false');
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.setAttribute('aria-hidden', 'true');
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  triggers.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      openModal();
    });
  });

  closeButtons.forEach(function(btn) {
    btn.addEventListener('click', closeModal);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
  });
})();
</script>
