# TrueUp Website — Jekyll config
# GitHub Pages compatible

title: TrueUp
description: "Expert guidance over video. Clear, trusted, and worth paying for."
baseurl: ""
url: ""

# Build — no theme so our _layouts and css/main.css are used
theme: null

markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs/

